<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/api/application-images/favicon" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>YuriID</title>
		<meta name="application-name" content="YuriID" />
		<meta name="apple-mobile-web-app-title" content="YuriID" />
		<meta name="description" content="YuriID: passkey sign-in for Yuri Systems" />
		<meta property="og:title" content="YuriID" />
		<meta property="og:site_name" content="YuriID" />
		<meta name="theme-color" content="#fdf0f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1d171f" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/app.webmanifest" />
		<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
		<script>
			try {
				const mode = localStorage?.getItem('mode-watcher-mode') || 'system';
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const isDark = mode === 'dark' || (mode === 'system' && prefersDark);

				document.documentElement.classList.toggle('dark', isDark);
				document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
			} catch (e) {
				// Ignore errors
				// Failing to set theme is not critical
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
